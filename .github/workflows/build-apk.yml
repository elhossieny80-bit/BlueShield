name: Build BlueShield app

on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check the password secret
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "::error::Add the secret KS_PASS first (Settings > Secrets and variables > Actions)."; exit 1; fi

      - name: Check the app link
        run: |
          if grep -q PUT_APP_LINK_HERE app/src/main/res/values/strings.xml; then echo "::error::Put the app link in android/app/src/main/res/values/strings.xml"; exit 1; fi

      - name: Build
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk ../BlueShield.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BlueShield-app
          path: BlueShield.apk
          retention-days: 30
