plugins {
    id 'com.android.application'
}

android {
    namespace 'com.blueshield.invoices'
    compileSdk 34

    defaultConfig {
        applicationId 'com.blueshield.invoices'
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    signingConfigs {
        release {
            storeFile file('blueshield.jks')
            storePassword System.getenv('KS_PASS') ?: ''
            keyAlias 'blueshield'
            keyPassword System.getenv('KS_PASS') ?: ''
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
